# One-click public demo on Render: https://render.com/deploy
# The demo household reseeds every 30 minutes, so strangers can try every tool,
# including writes, without leaving a mess for the next visitor.
services:
  - type: web
    name: vetwise
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: VETWISE_DEMO
        value: "1"
      # The demo story starts at 21:40 with two doses still due. Confirmations
      # expire on wall time, so the frozen clock does not keep them alive.
      - key: DEMO_CLOCK
        value: "21:40"
      - key: VETWISE_DEMO_RESET_MINUTES
        value: "30"
      - key: VETWISE_AGENT
        value: scripted
